# Демо-стенд веб-интерфейса Eva на GitHub Pages.
# Статическая сборка фронта (без бэкенда: API/WS-запросы в демо не отвечают).
# URL после деплоя: https://mrsat13.github.io/Eva/
# Включение: Settings -> Pages -> Source: GitHub Actions.
name: Demo page

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/demo.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build-only -- --base=/Eva/
        working-directory: frontend
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
